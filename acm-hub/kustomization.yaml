# ACM hub: operator + MultiClusterHub.
# Deploy order is handled by Kustomize; MultiClusterHub depends on the operator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-cluster-management
resources:
  - namespace.yaml
  - operator-group.yaml
  - subscription.yaml
  - multiclusterhub.yaml
