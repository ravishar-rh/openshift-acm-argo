# List of clusters that will run ACM (Advanced Cluster Management) as the hub.
# One Application per entry: deploys ACM operator + MultiClusterHub to that cluster.
# The hub will be used later to automate deployment of new managed clusters.
#
# Template variables: hub_name, url, namespace
---
- hub_name: hub
  url: https://kubernetes.default.svc
  namespace: open-cluster-management

